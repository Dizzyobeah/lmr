<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Model Router - Chat Tester</title>
    <script src="https://unpkg.com/alpinejs@3.13.5" defer></script>
    <link rel="stylesheet" href="{{.AdminPath}}/theme.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .layout {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: var(--space-2xl);
            padding: var(--space-2xl) var(--gutter);
            overflow: hidden;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
        }

        .chat-panel, .meta-panel {
            background: var(--color-canvas);
            border: 1px solid var(--color-hairline);
            border-radius: var(--radius-sm);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-2xl);
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .msg {
            max-width: 80%;
            padding: var(--space-md) var(--space-lg);
            border-radius: var(--radius-sm);
            word-wrap: break-word;
        }

        .msg > div:first-child { white-space: pre-wrap; }

        .msg.user {
            align-self: flex-end;
            background: var(--color-primary);
            color: var(--color-on-dark);
        }

        .msg.assistant {
            align-self: flex-start;
            background: var(--color-canvas);
            border: 1px solid var(--color-hairline);
        }

        .msg-meta {
            margin-top: var(--space-sm);
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-xs);
        }

        .empty-hint {
            margin: auto;
            color: var(--color-body-strong);
            font-size: var(--text-caption);
            text-align: center;
        }

        .composer {
            border-top: 1px solid var(--color-hairline);
            padding: var(--space-lg);
            display: flex;
            gap: var(--space-sm);
            align-items: flex-end;
        }

        .composer select {
            width: auto;
            min-width: 130px;
        }

        .composer textarea {
            flex: 1;
            resize: none;
            min-height: 44px;
            max-height: 160px;
        }

        .meta-panel h2 {
            padding: var(--space-2xl) var(--space-2xl) 0;
        }

        .meta-body {
            padding: var(--space-lg) var(--space-2xl);
            overflow-y: auto;
            flex: 1;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            gap: var(--space-md);
            padding: var(--space-sm) 0;
            border-bottom: 1px solid var(--color-hairline);
            font-size: var(--text-caption);
        }

        .meta-row .label { color: var(--color-body-strong); }
        .meta-body .empty-hint { margin-top: var(--space-xl); }
        .meta-row .value { font-weight: 500; text-align: right; overflow-wrap: anywhere; }

        .error-banner {
            background: var(--color-canvas);
            border: 1px solid var(--color-error);
            color: var(--color-error);
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-sm);
            margin: 0 var(--space-2xl) var(--space-md);
            font-size: var(--text-caption);
        }

        .typing { animation: pulse 1.2s infinite; color: var(--color-body); }

        @media (max-width: 767px) {
            body { height: auto; min-height: 100vh; }
            .layout { grid-template-columns: 1fr; overflow: visible; }
            .messages { min-height: 50vh; }
            .composer { flex-wrap: wrap; }
            .composer select, .composer textarea, .composer .btn { flex: 1 1 100%; width: 100%; }
            .composer .btn { min-height: 44px; }
        }
    </style>
</head>
<body x-data="chatApp()">
    <header class="nav-bar">
        <h1 class="nav-brand">Local Model Router</h1>
        <nav class="pill-group">
            <a href="{{.AdminPath}}">Dashboard</a>
            <a href="{{.AdminPath}}/chat" class="active">Chat Tester</a>
            <a href="#" @click.prevent="logout()">Logout</a>
        </nav>
    </header>
    <div class="brand-ribbon"></div>

    <div class="layout">
        <!-- Conversation -->
        <div class="chat-panel">
            <div class="messages" x-ref="messages">
                <template x-if="messages.length === 0">
                    <div class="empty-hint">
                        Send a message to test routing.<br>
                        Use <strong>auto</strong> to let the router pick a model,<br>or choose a specific model.
                    </div>
                </template>
                <template x-for="(m, i) in messages" :key="i">
                    <div class="msg" :class="m.role">
                        <div x-text="m.content"></div>
                        <template x-if="m.role === 'assistant' && m.meta">
                            <div class="msg-meta">
                                <span class="badge" :class="'badge-' + m.meta.category" x-text="m.meta.model"></span>
                                <span class="badge badge-general" x-text="m.meta.category"></span>
                                <span class="badge badge-general" x-text="m.meta.total_tokens + ' tok'"></span>
                                <span class="badge badge-general" x-text="m.meta.latency_ms + ' ms'"></span>
                            </div>
                        </template>
                    </div>
                </template>
                <template x-if="loading">
                    <div class="msg assistant typing">Thinking…</div>
                </template>
            </div>

            <template x-if="error">
                <div class="error-banner" x-text="error"></div>
            </template>

            <form class="composer" @submit.prevent="send()">
                <select x-model="selectedModel" title="Model">
                    <option value="auto">auto</option>
                    {{range .Models}}<option value="{{.}}">{{.}}</option>{{end}}
                </select>
                <textarea x-model="input" placeholder="Type a message... (Enter to send, Shift+Enter for newline)"
                          @keydown.enter.prevent="if (!$event.shiftKey) send()"></textarea>
                <button type="submit" class="btn" :disabled="loading || !input.trim()">Send</button>
            </form>
        </div>

        <!-- Metadata panel -->
        <div class="meta-panel">
            <h2>Last routing decision</h2>
            <div class="meta-body">
                <template x-if="!lastMeta">
                    <div class="empty-hint">No requests yet</div>
                </template>
                <template x-if="lastMeta">
                    <div>
                        <div class="meta-row"><span class="label">Selected Model</span><span class="value" x-text="lastMeta.model"></span></div>
                        <div class="meta-row"><span class="label">Category</span><span class="value"><span class="badge" :class="'badge-' + lastMeta.category" x-text="lastMeta.category"></span></span></div>
                        <div class="meta-row"><span class="label">Reason</span><span class="value" x-text="lastMeta.reason"></span></div>
                        <div class="meta-row"><span class="label">Fallback</span><span class="value" x-text="lastMeta.fallback ? 'yes' : 'no'"></span></div>
                        <div class="meta-row"><span class="label">Prompt Tokens</span><span class="value" x-text="lastMeta.prompt_tokens"></span></div>
                        <div class="meta-row"><span class="label">Completion Tokens</span><span class="value" x-text="lastMeta.completion_tokens"></span></div>
                        <div class="meta-row"><span class="label">Total Tokens</span><span class="value" x-text="lastMeta.total_tokens"></span></div>
                        <div class="meta-row"><span class="label">Latency</span><span class="value" x-text="lastMeta.latency_ms + ' ms'"></span></div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <script>
        function chatApp() {
            return {
                adminPath: "{{.AdminPath}}",
                messages: [],
                input: '',
                selectedModel: 'auto',
                loading: false,
                error: '',
                lastMeta: null,

                async send() {
                    const text = this.input.trim();
                    if (!text || this.loading) return;
                    this.error = '';
                    this.messages.push({ role: 'user', content: text });
                    this.input = '';
                    this.loading = true;
                    this.scrollDown();

                    try {
                        const res = await fetch(this.adminPath + '/api/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                message: text,
                                model: this.selectedModel
                            })
                        });
                        const data = await res.json();
                        if (!res.ok) {
                            this.error = data.error || ('Request failed (' + res.status + ')');
                        } else {
                            this.messages.push({ role: 'assistant', content: data.content, meta: data });
                            this.lastMeta = data;
                        }
                    } catch (e) {
                        this.error = 'Network error: ' + e.message;
                    } finally {
                        this.loading = false;
                        this.scrollDown();
                    }
                },

                scrollDown() {
                    this.$nextTick(() => {
                        const el = this.$refs.messages;
                        if (el) el.scrollTop = el.scrollHeight;
                    });
                },

                logout() {
                    const f = document.createElement('form');
                    f.method = 'POST';
                    f.action = this.adminPath + '/logout';
                    document.body.appendChild(f);
                    f.submit();
                }
            };
        }
    </script>
</body>
</html>
