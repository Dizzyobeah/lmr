<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Model Router - Chat Tester</title>
    <script src="https://unpkg.com/alpinejs@3.13.5" defer></script>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --text-primary: #eaeaea;
            --text-secondary: #a0a0a0;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --success: #4ade80;
            --warning: #fbbf24;
            --error: #ef4444;
            --border: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--bg-secondary);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent);
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        nav a:hover, nav a.active {
            color: var(--text-primary);
            background: var(--bg-card);
        }

        .layout {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .chat-panel, .meta-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .msg.user {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg.assistant {
            align-self: flex-start;
            background: var(--bg-card);
            border-bottom-left-radius: 4px;
        }

        .msg-meta {
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.7rem;
        }

        .empty-hint {
            margin: auto;
            color: var(--text-secondary);
            text-align: center;
        }

        .composer {
            border-top: 1px solid var(--border);
            padding: 15px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .composer select {
            width: auto;
            min-width: 130px;
        }

        .composer textarea {
            flex: 1;
            resize: none;
            min-height: 44px;
            max-height: 160px;
            font-family: inherit;
        }

        input, select, textarea {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 6px;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            background: var(--accent);
            color: #fff;
        }

        .btn:hover:not(:disabled) { background: var(--accent-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .meta-panel h2 {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 18px 20px 0;
        }

        .meta-body {
            padding: 16px 20px;
            overflow-y: auto;
            flex: 1;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .meta-row .label { color: var(--text-secondary); }
        .meta-row .value { font-weight: 600; text-align: right; }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #fff;
        }

        .badge-code { background: #3b82f6; }
        .badge-reasoning { background: #8b5cf6; }
        .badge-simple { background: #22c55e; }
        .badge-creative { background: #f59e0b; }
        .badge-math { background: #ef4444; }
        .badge-general { background: #6b7280; }

        .error-banner {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            margin: 0 20px 12px;
            font-size: 0.85rem;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .typing { animation: pulse 1.2s infinite; color: var(--text-secondary); }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="chatApp()">
    <header>
        <h1>Local Model Router</h1>
        <nav>
            <a href="{{.AdminPath}}">Dashboard</a>
            <a href="{{.AdminPath}}/chat" class="active">Chat Tester</a>
            <a href="#" @click.prevent="logout()">Logout</a>
        </nav>
    </header>

    <div class="layout">
        <!-- Conversation -->
        <div class="chat-panel">
            <div class="messages" x-ref="messages">
                <template x-if="messages.length === 0">
                    <div class="empty-hint">
                        Send a message to test routing.<br>
                        Use <strong>auto</strong> to let the router pick a model,<br>or choose a specific model.
                    </div>
                </template>
                <template x-for="(m, i) in messages" :key="i">
                    <div class="msg" :class="m.role">
                        <div x-text="m.content"></div>
                        <template x-if="m.role === 'assistant' && m.meta">
                            <div class="msg-meta">
                                <span class="badge" :class="'badge-' + m.meta.category" x-text="m.meta.model"></span>
                                <span class="badge badge-general" x-text="m.meta.category"></span>
                                <span class="badge badge-general" x-text="m.meta.total_tokens + ' tok'"></span>
                                <span class="badge badge-general" x-text="m.meta.latency_ms + ' ms'"></span>
                            </div>
                        </template>
                    </div>
                </template>
                <template x-if="loading">
                    <div class="msg assistant typing">Thinking…</div>
                </template>
            </div>

            <template x-if="error">
                <div class="error-banner" x-text="error"></div>
            </template>

            <form class="composer" @submit.prevent="send()">
                <select x-model="selectedModel" title="Model">
                    <option value="auto">auto</option>
                    {{range .Models}}<option value="{{.}}">{{.}}</option>{{end}}
                </select>
                <textarea x-model="input" placeholder="Type a message... (Enter to send, Shift+Enter for newline)"
                          @keydown.enter.prevent="if (!$event.shiftKey) send()"></textarea>
                <button type="submit" class="btn" :disabled="loading || !input.trim()">Send</button>
            </form>
        </div>

        <!-- Metadata panel -->
        <div class="meta-panel">
            <h2>Last Routing Decision</h2>
            <div class="meta-body">
                <template x-if="!lastMeta">
                    <div class="empty-hint" style="margin-top:20px;">No requests yet</div>
                </template>
                <template x-if="lastMeta">
                    <div>
                        <div class="meta-row"><span class="label">Selected Model</span><span class="value" x-text="lastMeta.model"></span></div>
                        <div class="meta-row"><span class="label">Category</span><span class="value"><span class="badge" :class="'badge-' + lastMeta.category" x-text="lastMeta.category"></span></span></div>
                        <div class="meta-row"><span class="label">Reason</span><span class="value" x-text="lastMeta.reason"></span></div>
                        <div class="meta-row"><span class="label">Fallback</span><span class="value" x-text="lastMeta.fallback ? 'yes' : 'no'"></span></div>
                        <div class="meta-row"><span class="label">Prompt Tokens</span><span class="value" x-text="lastMeta.prompt_tokens"></span></div>
                        <div class="meta-row"><span class="label">Completion Tokens</span><span class="value" x-text="lastMeta.completion_tokens"></span></div>
                        <div class="meta-row"><span class="label">Total Tokens</span><span class="value" x-text="lastMeta.total_tokens"></span></div>
                        <div class="meta-row"><span class="label">Latency</span><span class="value" x-text="lastMeta.latency_ms + ' ms'"></span></div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <script>
        function chatApp() {
            return {
                adminPath: "{{.AdminPath}}",
                messages: [],
                input: '',
                selectedModel: 'auto',
                loading: false,
                error: '',
                lastMeta: null,

                async send() {
                    const text = this.input.trim();
                    if (!text || this.loading) return;
                    this.error = '';
                    this.messages.push({ role: 'user', content: text });
                    this.input = '';
                    this.loading = true;
                    this.scrollDown();

                    try {
                        const res = await fetch(this.adminPath + '/api/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                message: text,
                                model: this.selectedModel
                            })
                        });
                        const data = await res.json();
                        if (!res.ok) {
                            this.error = data.error || ('Request failed (' + res.status + ')');
                        } else {
                            this.messages.push({ role: 'assistant', content: data.content, meta: data });
                            this.lastMeta = data;
                        }
                    } catch (e) {
                        this.error = 'Network error: ' + e.message;
                    } finally {
                        this.loading = false;
                        this.scrollDown();
                    }
                },

                scrollDown() {
                    this.$nextTick(() => {
                        const el = this.$refs.messages;
                        if (el) el.scrollTop = el.scrollHeight;
                    });
                },

                logout() {
                    const f = document.createElement('form');
                    f.method = 'POST';
                    f.action = this.adminPath + '/logout';
                    document.body.appendChild(f);
                    f.submit();
                }
            };
        }
    </script>
</body>
</html>
