services:
  local-model-router:
    build: .
    container_name: local-model-router
    ports:
      - "8080:8080"
    environment:
      - AUTH_ENCRYPTION_KEY=${AUTH_ENCRYPTION_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Talk to the containerized Ollama over the shared Docker network.
      # This avoids the slow host.docker.internal round-trip (~290ms/request
      # on Docker Desktop / WSL2) and keeps router<->Ollama container-to-container.
      - OLLAMA_ENDPOINT=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - router-net
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Containerized Ollama on the shared Docker network. The router reaches it
  # as http://ollama:11434 (container-to-container, no host NAT hop).
  # Uses the host's existing model files via a bind mount, so no re-download.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      # Keep a model resident indefinitely so repeat requests are warm
      # (no multi-second reloads) instead of unloading after 5 min idle.
      - OLLAMA_KEEP_ALIVE=-1
      # Flash attention shrinks the KV cache -> lower VRAM, better fit on 8GB.
      - OLLAMA_FLASH_ATTENTION=1
      # Serve one model at a time (8GB VRAM can't hold two large models).
      - OLLAMA_MAX_LOADED_MODELS=1
    # Models live in a fast WSL2-native Docker volume (not a Windows bind
    # mount) so cold loads are quick. Populate/refresh with scripts/sync-models.
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - router-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # GPU passthrough (NVIDIA). Docker Desktop exposes the nvidia runtime.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - router-net
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    networks:
      - router-net
    profiles:
      - monitoring

# Explicit user-defined bridge so router <-> ollama traffic stays
# container-to-container (DNS name "ollama", no host NAT hop) and is isolated
# from other compose projects on the host.
networks:
  router-net:
    driver: bridge

volumes:
  ollama_models:
  prometheus_data:
  grafana_data:
