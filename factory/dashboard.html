<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Board</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --pass: #15803d; --pass-bg: #dcfce7; --changes: #b45309; --changes-bg: #fef3c7;
    --pending: #6b7280; --pending-bg: #eef0f3; --accent: #2563eb;
    --human: #c2410c; --human-bg: #fff4ec; --merged: #4b5563;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --panel: #171b23; --ink: #e6e9ef; --muted: #8b93a3; --line: #262c38;
      --pass: #4ade80; --pass-bg: #14301f; --changes: #fbbf24; --changes-bg: #3a2c0c;
      --pending: #8b93a3; --pending-bg: #222835; --accent: #60a5fa;
      --human: #fb923c; --human-bg: #2e1d10; --merged: #9ca3af;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1218; --panel: #171b23; --ink: #e6e9ef; --muted: #8b93a3; --line: #262c38;
    --pass: #4ade80; --pass-bg: #14301f; --changes: #fbbf24; --changes-bg: #3a2c0c;
    --pending: #8b93a3; --pending-bg: #222835; --accent: #60a5fa;
    --human: #fb923c; --human-bg: #2e1d10; --merged: #9ca3af;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 18px 20px 6px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  header .status { color: var(--muted); font-size: 12px; }
  header .status.off { color: var(--human); }
  .board { display: grid; grid-template-columns: repeat(7, minmax(170px, 1fr)); gap: 12px;
    padding: 12px 20px 28px; overflow-x: auto; }
  .col { min-width: 0; }
  .col h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
    margin: 0 0 8px; display: flex; justify-content: space-between; }
  .col h2 .n { font-weight: 500; }
  .col.human h2 { color: var(--human); }
  .lane { display: flex; flex-direction: column; gap: 8px; min-height: 60px;
    border-top: 2px solid var(--line); padding-top: 8px; }
  .col.human .lane { border-top-color: var(--human); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px;
    cursor: pointer; text-align: left; color: inherit; font: inherit; width: 100%; }
  .card:hover { border-color: var(--accent); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.human { border-color: var(--human); background: var(--human-bg); box-shadow: 0 0 0 1px var(--human) inset; }
  .card.merged { opacity: .7; }
  .card .id { color: var(--muted); }
  .card .title { font-weight: 600; margin: 2px 0 6px; overflow-wrap: anywhere; }
  .card .meta { color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .rounds { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .round { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .round .r { width: 22px; color: var(--muted); font-size: 11px; }
  .chip { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: var(--pending-bg);
    color: var(--pending); border: 1px solid transparent; }
  .chip.PASS { background: var(--pass-bg); color: var(--pass); }
  .chip.CHANGES { background: var(--changes-bg); color: var(--changes); }
  .chip.pending { border-style: dashed; border-color: var(--line); }
  .facts { margin-top: 8px; color: var(--muted); font-size: 11.5px; display: flex; flex-direction: column; gap: 2px; }
  .facts .mono { overflow-wrap: anywhere; }
  .facts a { color: var(--accent); }
  .flag { display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 600; color: var(--human); }
  .empty { color: var(--muted); font-size: 12px; padding: 6px 2px; }
  .hint { color: var(--muted); font-size: 12px; padding: 0 20px 20px; }
  /* drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--panel);
    border-left: 1px solid var(--line); display: none; flex-direction: column; }
  .open .scrim { display: block; } .open .drawer { display: flex; }
  .drawer header { padding: 14px 16px 8px; border-bottom: 1px solid var(--line); justify-content: space-between; }
  .drawer header button { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 6px;
    padding: 3px 9px; cursor: pointer; font: inherit; }
  .tabs { display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tabs button { font: inherit; font-size: 12px; background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 6px; padding: 3px 8px; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
  .doc { padding: 4px 20px 30px; overflow: auto; }
  .doc h1, .doc h2, .doc h3 { line-height: 1.25; margin: 18px 0 8px; } .doc h1 { font-size: 18px; }
  .doc h2 { font-size: 15px; } .doc h3 { font-size: 14px; }
  .doc pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow: auto; }
  .doc blockquote { margin: 8px 0; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .doc ul { padding-left: 20px; } .doc li.task { list-style: none; margin-left: -18px; }
  .verdict { display: inline-block; margin: 14px 0 4px; padding: 3px 10px; border-radius: 6px; font-weight: 700; }
  .verdict.PASS, .verdict.APPROVE { background: var(--pass-bg); color: var(--pass); }
  .verdict.CHANGES, .verdict.ESCALATE { background: var(--changes-bg); color: var(--changes); }
  @media (max-width: 720px) {
    .board { grid-template-columns: minmax(0, 1fr); }
    header, .board, .hint { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>Factory</h1>
  <span class="status" id="status">loading board.json...</span>
</header>
<main class="board" id="board"></main>
<p class="hint">Run <code>/factory &lt;feature&gt;</code> or <code>/factory next</code> in Claude Code. Click a card to read its files.</p>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Job files">
  <header><strong class="mono" id="dTitle"></strong><button id="dClose">Close</button></header>
  <nav class="tabs" id="dTabs"></nav>
  <article class="doc" id="dDoc"></article>
</aside>

<script>
const STAGES = [
  ["spec", "Spec"], ["build", "Build"], ["review", "Review"],
  ["approve", "Approve"], ["pr-open", "PR open"], ["merged", "Merged"], ["needs-human", "Needs human"],
];
// Reviewer chips come from board.json (`reviewers`, written by board.py from config.json).
let REVIEWERS = [["security", "sec"], ["ux", "ux"], ["ui", "ui"], ["code", "code"]];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let lastText = "", jobs = [], openId = null;

async function poll() {
  try {
    const res = await fetch("board.json", { cache: "no-store" });
    const text = await res.text();
    const board = JSON.parse(text); // a half-written file throws; keep the last good board
    $("status").className = "status";
    $("status").textContent = "live · " + new Date().toLocaleTimeString();
    if (text === lastText) return;
    lastText = text;
    jobs = board.jobs || [];
    if (Array.isArray(board.reviewers) && board.reviewers.length) REVIEWERS = board.reviewers;
    render();
    if (openId) openJob(openId, true);
  } catch (e) {
    $("status").className = "status off";
    $("status").textContent = "can't read board.json (serve it with: python3 factory/board.py serve)";
  }
}

function chips(reviews) {
  return REVIEWERS.map(([k, label]) => {
    const v = (reviews || {})[k] || "pending";
    return `<span class="chip ${esc(v)}" title="${k}: ${esc(v)}">${label}</span>`;
  }).join("");
}

function facts(j) {
  const rows = [];
  if (j.tests) rows.push(`<span class="mono" title="last test result">${esc(j.tests)}</span>`);
  const ab = j.ahead_behind;
  if (ab) rows.push(`<span title="vs origin/main">${ab.ahead} ahead · ${ab.behind} behind main</span>`);
  if (j.pr && /^https:\/\//.test(j.pr)) rows.push(`<a href="${esc(j.pr)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">pull request</a>`);
  return rows.length ? `<div class="facts">${rows.join("")}</div>` : "";
}

function card(j) {
  const human = j.stage === "needs-human";
  const rounds = [...(j.history || [])];
  if (j.reviews && Object.keys(j.reviews).length) rounds.push(j.reviews);
  const rows = rounds.map((r, i) => `<div class="round"><span class="r">R${i + 1}</span>${chips(r)}</div>`).join("");
  return `<button class="card ${human ? "human" : ""} ${j.stage === "merged" ? "merged" : ""}" data-id="${esc(j.id)}">
    <div class="id mono">${esc(j.id)}</div>
    <div class="title">${esc(j.title || j.id)}</div>
    <div class="meta"><span class="mono">${esc(j.branch || "")}</span>${j.round ? `<span>round ${j.round}</span>` : ""}</div>
    ${rows ? `<div class="rounds">${rows}</div>` : ""}
    ${facts(j)}
    ${human ? `<span class="flag">Needs a human · /factory approve ${esc(j.id)}</span>` : ""}
  </button>`;
}

function render() {
  $("board").innerHTML = STAGES.map(([key, label]) => {
    const list = jobs.filter(j => j.stage === key);
    return `<section class="col ${key === "needs-human" ? "human" : ""}">
      <h2><span>${label}</span><span class="n">${list.length || ""}</span></h2>
      <div class="lane">${list.map(card).join("") || `<div class="empty">—</div>`}</div>
    </section>`;
  }).join("");
}

// ---- drawer: list the job's files by convention, skip the ones that don't exist yet
function filesFor(j) {
  const f = ["spec.md", "build.md"];
  for (let n = 1; n <= (j.round || 0); n++) {
    REVIEWERS.forEach(([k]) => f.push(`round-${n}/review-${k}.md`));
    f.push(`rework-${n}.md`);
  }
  f.push("decision.md");
  return f;
}

async function openJob(id, refresh) {
  const j = jobs.find(x => x.id === id);
  if (!j) return;
  openId = id;
  document.body.classList.add("open");
  $("dTitle").textContent = `${j.id} · ${j.stage}`;
  const found = (await Promise.all(filesFor(j).map(async name => {
    try {
      const r = await fetch(`jobs/${j.id}/${name}`, { cache: "no-store" });
      return r.ok ? { name, text: await r.text() } : null;
    } catch { return null; }
  }))).filter(Boolean);
  const current = $("dTabs").querySelector('[aria-selected="true"]')?.dataset.name;
  $("dTabs").innerHTML = found.map(f => `<button data-name="${esc(f.name)}">${esc(f.name)}</button>`).join("")
    || `<span class="empty">No files yet.</span>`;
  const pick = (refresh && found.find(f => f.name === current)) || found[found.length - 1];
  const show = f => {
    $("dTabs").querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.name === f.name));
    $("dDoc").innerHTML = md(f.text);
  };
  $("dTabs").querySelectorAll("button").forEach(b => b.onclick = () => show(found.find(f => f.name === b.dataset.name)));
  if (pick) show(pick); else $("dDoc").innerHTML = "";
}

function closeJob() { openId = null; document.body.classList.remove("open"); }

// ---- tiny markdown: headings, code fences, lists, tasks, quotes, bold, inline code
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(text) {
  const lines = text.replace(/\r/g, "").split("\n");
  let out = "", inCode = false, inList = false;
  const first = lines[0]?.trim().match(/^(VERDICT:\s*)?(PASS|CHANGES|APPROVE|ESCALATE)\b/);
  if (first) { out += `<div class="verdict ${first[2]}">${esc(lines[0].trim())}</div>`; lines.shift(); }
  const endList = () => { if (inList) { out += "</ul>"; inList = false; } };
  for (const line of lines) {
    if (line.startsWith("```")) { endList(); out += inCode ? "</code></pre>" : "<pre><code>"; inCode = !inCode; continue; }
    if (inCode) { out += esc(line) + "\n"; continue; }
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { endList(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
    else if ((m = line.match(/^\s*[-*]\s+\[( |x)\]\s+(.*)/i))) {
      if (!inList) { out += "<ul>"; inList = true; }
      out += `<li class="task">${m[1].trim() ? "☑" : "☐"} ${inline(m[2])}</li>`;
    }
    else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^>\s?(.*)/))) { endList(); out += `<blockquote>${inline(m[1])}</blockquote>`; }
    else if (line.trim() === "") { endList(); }
    else { endList(); out += `<p>${inline(line)}</p>`; }
  }
  endList();
  if (inCode) out += "</code></pre>";
  return out;
}

$("board").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) openJob(c.dataset.id); });
$("dClose").onclick = closeJob;
$("scrim").onclick = closeJob;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeJob(); });
render();
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
